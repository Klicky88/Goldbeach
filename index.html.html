<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>YOU GOT RICKROLLED</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;min-height:100%;background:#000}
    body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom));overflow-x:hidden;color:#fff;font-family:Arial,Helvetica,sans-serif;animation:backgroundPulse 2s infinite alternate}
    .page{width:100%;max-width:540px;display:flex;flex-direction:column;align-items:center;text-align:center}
    .gif-wrapper{width:min(92vw,480px);overflow:hidden;border:3px solid rgba(255,255,255,.9);border-radius:18px;background:#000;box-shadow:0 0 10px #fff,0 0 25px #00ffff,0 0 50px #00ffff;animation:gifPulse 2.2s infinite ease-in-out}
    .gif-wrapper img{display:block;width:100%;height:auto;object-fit:contain}
    h1{margin-top:28px;font-size:clamp(34px,10vw,68px);line-height:1.03;font-weight:900;letter-spacing:1px;color:#fff;text-shadow:0 0 8px #fff,0 0 18px #00ffff,0 0 35px #00ffff,0 0 60px #00ffff;animation:blink .85s infinite,textPulse 1.7s infinite ease-in-out}
    .counter-box{margin-top:24px;padding:11px 19px;font-size:clamp(16px,4.5vw,22px);font-weight:700;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.35);border-radius:999px;box-shadow:0 0 10px rgba(255,255,255,.35),0 0 18px rgba(0,255,255,.35);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
    #visitor-count{display:inline-block;min-width:30px;color:#00ffff}
    .music-button{margin-top:16px;padding:11px 18px;color:#fff;background:rgba(255,255,255,.1);font-size:16px;font-weight:700;border:1px solid rgba(255,255,255,.4);border-radius:999px;cursor:pointer;box-shadow:0 0 12px rgba(0,255,255,.4);touch-action:manipulation}
    .music-button:active{transform:scale(.96)}
    .emoji{margin-top:12px;font-size:29px}
    .start-screen{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;background:#000}
    .start-screen h2{font-size:clamp(36px,11vw,72px);line-height:1.05;color:#fff;text-shadow:0 0 10px #fff,0 0 25px #00ffff,0 0 50px #00ffff;animation:startPulse 1.2s infinite ease-in-out}
    .start-screen p{font-size:clamp(17px,5vw,25px);font-weight:700}
    .start-button{padding:15px 34px;color:#000;background:#fff;font-size:21px;font-weight:900;border:0;border-radius:999px;cursor:pointer;box-shadow:0 0 15px #fff,0 0 35px #00ffff;touch-action:manipulation}
    .hidden{display:none!important}
    @keyframes blink{0%,42%{opacity:1}50%,78%{opacity:.12}86%,100%{opacity:1}}
    @keyframes textPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @keyframes gifPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
    @keyframes backgroundPulse{from{background:#000}to{background:#101010}}
    @keyframes startPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
    @media(max-height:720px){.gif-wrapper{width:min(70vw,340px)}h1{margin-top:17px;font-size:clamp(29px,8vw,49px)}.counter-box{margin-top:15px}.music-button{margin-top:11px}}
  </style>
</head>
<body>
  <div class="start-screen" id="start-screen">
    <h2>ARE YOU READY?</h2>
    <p>Tippe auf START</p>
    <button class="start-button" id="start-button" type="button">START</button>
  </div>

  <main class="page">
    <div class="gif-wrapper">
      <img src="./giphy-downsized.GIF" alt="Rickroll GIF" fetchpriority="high">
    </div>
    <h1>YOU GOT<br>RICKROLLED</h1>
    <div class="counter-box">Besucher Nr. <span id="visitor-count">...</span></div>
    <button class="music-button" id="music-button" type="button">▶️ Musik starten</button>
    <div class="emoji">😂</div>
  </main>

  <audio id="background-music" preload="auto" loop playsinline webkit-playsinline>
    <source src="./Rickroll.mp3" type="audio/mpeg">
  </audio>

  <script src="https://cdn.jsdelivr.net/npm/counterapi/dist/counter.browser.min.js"></script>
  <script>
    "use strict";
    const startScreen=document.getElementById("start-screen");
    const startButton=document.getElementById("start-button");
    const musicButton=document.getElementById("music-button");
    const music=document.getElementById("background-music");
    music.volume=1;

    async function playMusic(){
      music.muted=false;
      try{
        await music.play();
        musicButton.textContent="🔊 Musik ausschalten";
        return true;
      }catch(error){
        console.error("Musik konnte nicht gestartet werden:",error);
        musicButton.textContent="▶️ Musik starten";
        return false;
      }
    }

    async function openPage(event){
      if(event){event.preventDefault();event.stopPropagation()}
      await playMusic();
      startScreen.classList.add("hidden");
    }

    startButton.addEventListener("click",openPage);

    musicButton.addEventListener("click",async function(){
      if(music.paused){
        await playMusic();
      }else{
        music.pause();
        musicButton.textContent="▶️ Musik einschalten";
      }
    });

    music.addEventListener("error",function(){
      console.error("Rickroll.mp3 konnte nicht geladen werden.");
      musicButton.textContent="❌ Musikdatei nicht gefunden";
    });

    document.addEventListener("DOMContentLoaded",function(){
      const countElement=document.getElementById("visitor-count");
      try{
        const counter=new Counter({workspace:"dkl-rickroll-2026"});
        counter.up("seitenbesucher").then(function(result){
          const value=Number(result.value);
          countElement.textContent=Number.isFinite(value)?value.toLocaleString("de-DE"):"👀";
        }).catch(function(error){
          console.error("Besucherzähler konnte nicht geladen werden:",error);
          countElement.textContent="👀";
        });
      }catch(error){
        console.error("Fehler beim Besucherzähler:",error);
        countElement.textContent="👀";
      }
    });
  </script>
</body>
</html>
