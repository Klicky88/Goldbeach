<!-- GoatCounter Tracking -->
<script data-goatcounter="https://goldbeach.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<!-- Besucherzähler -->
<div id="counter" style="margin-top:25px;"></div>

<script>
window.addEventListener("load", function () {
    var t = setInterval(function () {
        if (window.goatcounter && window.goatcounter.visit_count) {
            clearInterval(t);

            window.goatcounter.visit_count({
                append: "#counter",
                path: "TOTAL",
                no_branding: true,
                style: `
                    div{
                        background:#000;
                        color:#fff;
                        border:2px solid #fff;
                        border-radius:12px;
                        padding:10px 18px;
                        font-size:22px;
                        font-family:Arial, sans-serif;
                    }
                `
            });
        }
    }, 100);
});
</script>
