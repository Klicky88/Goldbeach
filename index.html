<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goldbeach</title>

  <style>
    body {
      margin: 0;
      background: black;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #startbild {
      max-width: 90vw;
      max-height: 80vh;
      border-radius: 10px;
      transition: opacity 1s ease;
    }

    #videoBox {
      display: none;
      width: 90vw;
      max-width: 430px;
      aspect-ratio: 9 / 16;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <img id="startbild" src="Goldbeach%202.jpeg" alt="Goldbeach">

  <div id="videoBox">
    <iframe
      src="https://www.youtube.com/embed/_6HzLIJPH2A?autoplay=1&mute=1&playsinline=1&rel=0"
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    setTimeout(function () {
      document.getElementById("startbild").style.opacity = "0";

      setTimeout(function () {
        document.getElementById("startbild").style.display = "none";
        document.getElementById("videoBox").style.display = "block";
      }, 1000);
    }, 2000);
  </script>

</body>
</html>
