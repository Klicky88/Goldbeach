<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goldbeach</title>

    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
        }

        #bild {
            max-width: 90vw;
            max-height: 80vh;
            width: auto;
            height: auto;
            display: block;
            border-radius: 10px;
        }

        #besucher {
            margin-top: 25px;
            color: white;
            font-size: 18px;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <img id="bild" src="Goldbeach%202.jpeg" alt="Goldbeach">

    <div id="besucher"></div>

    <script>
    var t = setInterval(function () {
        if (window.goatcounter && window.goatcounter.visit_count) {
            clearInterval(t);
            window.goatcounter.visit_count({
                append: "#besucher",
                no_branding: true,
                type: "html"
            });
        }
    }, 100);
    </script>

    <script data-goatcounter="https://goldbeach.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>

</body>
</html>
