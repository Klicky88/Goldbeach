<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goldbeach</title>

  <style>
    body {
      margin: 0;
      background: black;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    #startbild {
      max-width: 90vw;
      max-height: 75vh;
      border-radius: 10px;
      transition: opacity 1s ease;
    }

    #videoBox {
      display: none;
      width: 90vw;
      max-width: 430px;
      aspect-ratio: 9 / 16;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 10px;
    }

    #besucher {
      margin-top: 20px;
      color: white;
      font-size: 18px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <img id="startbild" src="Goldbeach%202.jpeg" alt="Goldbeach">

  <div id="videoBox">
    <iframe
      src="https://www.youtube.com/embed/Aq5WXmQQooo?autoplay=1&mute=1&playsinline=1&rel=0"
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <div id="besucher">Besucher: …</div>

  <script>
    setTimeout(function () {
      document.getElementById("startbild").style.opacity = "0";

      setTimeout(function () {
        document.getElementById("startbild").style.display = "none";
        document.getElementById("videoBox").style.display = "block";
      }, 1000);
    }, 2000);
  </script>

  <script data-goatcounter="https://goldbeach.goatcounter.com/count"
          async src="https://gc.zgo.at/count.js"></script>

  <script>
    fetch("https://goldbeach.goatcounter.com/counter/%2FGoldbeach%2F.json")
      .then(response => response.json())
      .then(data => {
        document.getElementById("besucher").textContent = "Besucher: " + data.count;
      })
      .catch(() => {
        document.getElementById("besucher").textContent = "Besucher: –";
      });
  </script>

</body>
</html>
