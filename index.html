<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nimm Dani mit!</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

.text{
    color:#ff1a1a;
    font-weight:bold;
    text-align:center;
    line-height:1.2;
    width:90%;
    font-size:clamp(2rem, 8vw, 5rem);

    text-shadow:
        0 0 10px #ff0000,
        0 0 20px #ff0000,
        0 0 40px #ff3333;

    animation:
        pulse 1.5s infinite alternate,
        float 3s ease-in-out infinite;
}

@keyframes pulse{
    from{
        transform:scale(1);
        text-shadow:
            0 0 10px #ff0000,
            0 0 20px #ff0000,
            0 0 40px #ff3333;
    }
    to{
        transform:scale(1.08);
        text-shadow:
            0 0 20px #ff0000,
            0 0 40px #ff0000,
            0 0 80px #ff4444;
    }
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}
</style>
</head>

<body>

<div class="text">
Nimm Dani mit,<br>
sie schnarcht! :)
</div>

</body>
</html>
