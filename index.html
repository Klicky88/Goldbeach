<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nimm Dani mit, sie schnarcht!</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

.container{
    text-align:center;
}

.text{
    color:#ff0000;
    font-size:clamp(2.5rem,7vw,6rem);
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    border-right:5px solid red;
    width:0;
    animation:
        schreiben 4s steps(30,end) forwards,
        cursor 0.8s step-end infinite,
        pulsieren 2s ease-in-out 4.2s infinite;
    text-shadow:
        0 0 10px red,
        0 0 25px red;
}

@keyframes schreiben{
    from{
        width:0;
    }
    to{
        width:100%;
    }
}

@keyframes cursor{
    50%{
        border-color:transparent;
    }
}

@keyframes pulsieren{
    0%,100%{
        transform:scale(1);
        text-shadow:
            0 0 10px red,
            0 0 25px red;
    }
    50%{
        transform:scale(1.08);
        text-shadow:
            0 0 20px red,
            0 0 45px red,
            0 0 80px red;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="text">Nimm Dani mit, sie schnarcht!</div>
</div>

</body>
</html>
