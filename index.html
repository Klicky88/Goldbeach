<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday Dorte</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: black;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    h1 {
      margin: 20px;
      color: red;
      font-size: clamp(3rem, 10vw, 9rem);
      font-weight: bold;
      text-align: center;
      line-height: 1.1;

      animation: pulsieren 1.8s ease-in-out infinite;
    }

    @keyframes pulsieren {
      0%,
      100% {
        transform: scale(1);
        opacity: 0.8;
        text-shadow:
          0 0 10px red,
          0 0 20px red;
      }

      50% {
        transform: scale(1.08);
        opacity: 1;
        text-shadow:
          0 0 20px red,
          0 0 40px red,
          0 0 70px red;
      }
    }
  </style>
</head>

<body>
  <h1>Happy Birthday Dorte</h1>
</body>
</html>

  <div id="besucher">Besucher: …</div>

  <script>
    setTimeout(function () {
      document.getElementById("startbild").style.opacity = "0";

      setTimeout(function () {
        document.getElementById("startbild").style.display = "none";
        document.getElementById("videoBox").style.display = "block";
      }, 1000);
    }, 2000);
  </script>

  <script data-goatcounter="https://goldbeach.goatcounter.com/count"
          async src="https://gc.zgo.at/count.js"></script>

  <script>
    fetch("https://goldbeach.goatcounter.com/counter/%2FGoldbeach%2F.json")
      .then(response => response.json())
      .then(data => {
        document.getElementById("besucher").textContent = "Besucher: " + data.count;
      })
      .catch(() => {
        document.getElementById("besucher").textContent = "Besucher: –";
      });
  </script>

</body>
</html>
